<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Illustrative error bars with the always-zero baseline lowest">
<style>@media (prefers-reduced-motion: reduce){.a{display:none}}</style>
<defs><radialGradient id="g1" cx="0.8" cy="0.1" r="0.7"><stop offset="0" stop-color="#ff5252" stop-opacity="0.22"/><stop offset="1" stop-color="#ff5252" stop-opacity="0"/></radialGradient><radialGradient id="g2" cx="0.1" cy="0.95" r="0.6"><stop offset="0" stop-color="#7c4dff" stop-opacity="0.14"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/></radialGradient><pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity="0.12"/></pattern></defs>
<rect width="1600" height="900" fill="#05060a"/><rect width="1600" height="900" fill="url(#dots)"/><rect width="1600" height="900" fill="url(#g1)"/><rect width="1600" height="900" fill="url(#g2)"/><text x="90" y="210" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="110" font-weight="800" fill="#f4f6fb" fill-opacity="1" text-anchor="start" letter-spacing="-4">Error</text><text x="94" y="270" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#8b93a7" fill-opacity="1" text-anchor="start">lower is better</text><text x="94" y="310" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#8b93a7" fill-opacity="0.7" text-anchor="start">not to scale</text><rect x="500" y="290" width="190" height="470" rx="14" fill="#ff5252"/><text x="595" y="802" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#8b93a7" fill-opacity="1" text-anchor="middle">rule of thumb</text><rect x="760" y="360" width="190" height="400" rx="14" fill="#475069"/><text x="855" y="802" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#8b93a7" fill-opacity="1" text-anchor="middle">moving average</text><rect x="1020" y="420" width="190" height="340" rx="14" fill="#475069"/><text x="1115" y="802" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#8b93a7" fill-opacity="1" text-anchor="middle">fancier model</text><rect x="1280" y="520" width="190" height="240" rx="14" fill="#00bfa5"/><text x="1375" y="802" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#8b93a7" fill-opacity="1" text-anchor="middle">always zero</text>
</svg>
